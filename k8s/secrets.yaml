apiVersion: v1
kind: ServiceAccount
metadata:
  name: gaea-service-account
  namespace: gaea
  annotations:
    iam.gke.io/gcp-service-account: gaea-services@${PROJECT_ID}.iam.gserviceaccount.com
---
apiVersion: v1
kind: Secret
metadata:
  name: gaea-secrets
  namespace: gaea
type: Opaque
stringData:
  DATABASE_URL: "projects/${PROJECT_ID}/secrets/DATABASE_URL/versions/latest"
  PPLX_API_KEY: "projects/${PROJECT_ID}/secrets/PPLX_API_KEY/versions/latest"
  GOOGLE_API_KEY: "projects/${PROJECT_ID}/secrets/GOOGLE_API_KEY/versions/latest"
  GOOGLE_CSE_ID: "projects/${PROJECT_ID}/secrets/GOOGLE_CSE_ID/versions/latest"