# Canonical government policy libraries and portals per province
# These are the most authoritative sources for Chinese energy regulations
# Prioritize these for discovery before general web search

guangdong:
  - name: "广东省人民政府文件库"
    url: "https://www.gd.gov.cn/zwgk/wjk/"
    type: "policy_library"
    priority: "high"
    doc_classes: ["regulations", "project_approval", "technical_standards"]

  - name: "广东省发改委政策文件"
    url: "https://drc.gd.gov.cn/zwgk/"
