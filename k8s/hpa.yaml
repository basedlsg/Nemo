# Horizontal Pod Autoscaler for GAEA services
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gaea-retriever-hpa
  namespace: gaea
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gaea-retriever
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
