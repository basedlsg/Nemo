substitutions:
  _REGION: "us-central1"
  _REPO: "gaea"

steps:
  # 1) Build gateway image
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:latest", "-f", "apps/api-gateway/Dockerfile", "."]
    
  # 2) Push gateway image
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:latest"]

  # 3) Deploy API Gateway to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy gaea-gateway \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:latest \
          --region ${_REGION} \
          --allow-unauthenticated \
          --set-secrets DATABASE_URL=DATABASE_URL:latest,PPLX_API_KEY=PPLX_API_KEY:latest,GOOGLE_API_KEY=GOOGLE_API_KEY:latest,GOOGLE_CSE_ID=GOOGLE_CSE_ID:latest \
          --update-env-vars "GAEA_ENV=prod,ZH_FIRST=true" \
          --memory=2Gi \
          --cpu=2 \
          --max-instances=10

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY