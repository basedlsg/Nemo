apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaea-guardrails
  namespace: gaea
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gaea-guardrails
  template:
    metadata:
      labels:
        app: gaea-guardrails
    spec:
      serviceAccountName: gaea-service-account
      containers:
      - name: guardrails
        image: us-central1-docker.pkg.dev/PROJECT_ID/gaea/guardrails:latest
        ports:
        - containerPort: 8080
        env:
        - name: GAEA_ENV
          value: "prod"
        - name: SERVICE_NAME
          value: "guardrails"
        envFrom:
        - secretRef:
            name: gaea-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "125m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gaea-guardrails-service
  namespace: gaea
spec:
  selector:
    app: gaea-guardrails
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP