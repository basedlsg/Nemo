substitutions:
  _REGION: "us-central1"
  _REPO: "gaea"

steps:
  # 1) Build container images
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:$SHORT_SHA", "-f", "apps/api-gateway/Dockerfile", "."]
    
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/retriever:$SHORT_SHA", "-f", "services/retriever/Dockerfile", "."]
    
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/composer:$SHORT_SHA", "-f", "services/composer/Dockerfile", "."]
    
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/guardrails:$SHORT_SHA", "-f", "services/guardrails/Dockerfile", "."]
    
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/discovery:$SHORT_SHA", "-f", "services/discovery/Dockerfile", "."]
    
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/verification:$SHORT_SHA", "-f", "services/verification/Dockerfile", "."]

  # 2) Push images to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:$SHORT_SHA"]
    
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/retriever:$SHORT_SHA"]
    
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/composer:$SHORT_SHA"]
    
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/guardrails:$SHORT_SHA"]
    
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/discovery:$SHORT_SHA"]
    
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/verification:$SHORT_SHA"]

  # 3) Deploy API Gateway to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy gaea-gateway \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gateway:$SHORT_SHA \
          --region ${_REGION} \
          --allow-unauthenticated \
          --set-secrets DATABASE_URL=DATABASE_URL:latest,PPLX_API_KEY=PPLX_API_KEY:latest,GOOGLE_API_KEY=GOOGLE_API_KEY:latest,GOOGLE_CSE_ID=GOOGLE_CSE_ID:latest \
          --update-env-vars "GAEA_ENV=prod,ZH_FIRST=true" \
          --memory=2Gi \
          --cpu=2 \
          --max-instances=10

  # 4) Get GKE credentials and deploy microservices
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: bash
    args:
      - -c
      - |
        gcloud container clusters get-credentials gaea-autopilot --region ${_REGION}
        
        # Apply Kubernetes manifests with PROJECT_ID substitution
        sed "s/PROJECT_ID/$PROJECT_ID/g" k8s/namespace.yaml | kubectl apply -f -
        sed "s/PROJECT_ID/$PROJECT_ID/g" k8s/secrets.yaml | kubectl apply -f -
        sed "s/PROJECT_ID/$PROJECT_ID/g" k8s/retriever.yaml | kubectl apply -f -
        sed "s/PROJECT_ID/$PROJECT_ID/g" k8s/composer.yaml | kubectl apply -f -
        sed "s/PROJECT_ID/$PROJECT_ID/g" k8s/guardrails.yaml | kubectl apply -f -
        sed "s/PROJECT_ID/$PROJECT_ID/g" k8s/discovery.yaml | kubectl apply -f -
        sed "s/PROJECT_ID/$PROJECT_ID/g" k8s/verification.yaml | kubectl apply -f -
        
        # Apply monitoring and autoscaling
        kubectl apply -f k8s/monitoring.yaml
        kubectl apply -f k8s/hpa.yaml
        
        # Update image tags
        kubectl set image deployment/gaea-retriever retriever=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/retriever:$SHORT_SHA -n gaea
        kubectl set image deployment/gaea-composer composer=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/composer:$SHORT_SHA -n gaea
        kubectl set image deployment/gaea-guardrails guardrails=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/guardrails:$SHORT_SHA -n gaea
        kubectl set image deployment/gaea-discovery discovery=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/discovery:$SHORT_SHA -n gaea
        kubectl set image deployment/gaea-verification verification=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/verification:$SHORT_SHA -n gaea
        
        # Wait for deployments to be ready
        kubectl wait --for=condition=available --timeout=300s deployment/gaea-retriever -n gaea
        kubectl wait --for=condition=available --timeout=300s deployment/gaea-composer -n gaea
        kubectl wait --for=condition=available --timeout=300s deployment/gaea-guardrails -n gaea

  # 5) Build and deploy Next.js UI
  - name: "node:18"
    entrypoint: bash
    args:
      - -c
      - |
        cd apps/explorer-ui
        
        # Get gateway URL for frontend config
        GATEWAY_URL=$(gcloud run services describe gaea-gateway --region ${_REGION} --format="value(status.url)" || echo "https://placeholder.run.app")
        echo "Gateway URL: $GATEWAY_URL"
        
        # Install dependencies and build
        npm ci
        npm run build
        
        # Create production Dockerfile
        cat > Dockerfile.prod << 'EOF'
        FROM node:18-alpine
        WORKDIR /app
        COPY package*.json ./
        RUN npm ci --only=production
        COPY .next ./.next
        COPY public ./public
        COPY next.config.js ./
        EXPOSE 3000
        CMD ["npm", "start"]
        EOF
        
        # Build and push UI container
        docker build -f Dockerfile.prod -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/explorer-ui:$SHORT_SHA .
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/explorer-ui:$SHORT_SHA
        
        # Deploy UI to Cloud Run
        gcloud run deploy gaea-ui \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/explorer-ui:$SHORT_SHA \
          --region ${_REGION} \
          --allow-unauthenticated \
          --update-env-vars "NEXT_PUBLIC_API_GATEWAY_URL=$GATEWAY_URL" \
          --memory=1Gi \
          --cpu=1

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY