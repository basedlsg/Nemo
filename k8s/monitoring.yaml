apiVersion: v1
kind: ConfigMap
metadata:
  name: gaea-monitoring-config
  namespace: gaea
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'gaea-services'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - gaea
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaea-prometheus
  namespace: gaea
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gaea-prometheus
  template:
    metadata:
      labels:
        app: gaea-prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config-volume
          mountPath: /etc/prometheus
        args:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus/'
          - '--web.console.libraries=/etc/prometheus/console_libraries'
          - '--web.console.templates=/etc/prometheus/consoles'
          - '--web.enable-lifecycle'
        resources:
          requests:
            memory: "256Mi"
            cpu: "125m"
          limits:
            memory: "512Mi"
            cpu: "250m"
      volumes:
      - name: config-volume
        configMap:
          name: gaea-monitoring-config
---
apiVersion: v1
kind: Service
metadata:
  name: gaea-prometheus-service
  namespace: gaea
spec:
  selector:
    app: gaea-prometheus
  ports:
  - port: 9090
    targetPort: 9090
  type: ClusterIP